name: Ajusta PPBS Prova

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Executa ajuste PPBS prova'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alterar somente a data da 1a avaliacao de PPBS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ppbs/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="lesson exam"><div class="ln">1ª Avaliação<span class="date">21/09/2026</span></div>'
          new = '<div class="lesson exam"><div class="ln">1ª Avaliação<span class="date">17/09/2026</span></div>'
          if old not in s:
              raise SystemExit('Bloco exato da 1ª avaliação não encontrado; abortando sem alterações.')
          if s.count(old) != 1:
              raise SystemExit('Bloco encontrado mais de uma vez; abortando por segurança.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ppbs/index.html
          git commit -m "Altera data da 1ª avaliação de PPBS para 17-09 [skip ci]"
          git push

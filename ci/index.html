<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CI — Comércio Internacional</title></head>
<body>
<div id="loader" style="font-family:Arial,sans-serif;padding:32px;text-align:center">Carregando Comércio Internacional...</div>
<script>
(async()=>{
  try{
    const fonte='https://raw.githubusercontent.com/advjuniorpedrocolombo-arch/3-TANE-IBIUNA/5ec2c612663703029bdd2d9f2eba469f38d2b0b4/ci/index.html?ts='+Date.now();
    const r=await fetch(fonte,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let html=await r.text();
    html=html.replace('</body>','<script src="../assets/portal-dinamico.js" data-componente="CI"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loader').innerHTML='<strong>Erro ao carregar a página de CI.</strong><br>'+e.message}
})();
</script>
</body></html>

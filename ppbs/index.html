<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PPBS — Processos de Produção de Bens e Serviços</title></head>
<body>
<div id="loader" style="font-family:Arial,sans-serif;padding:32px;text-align:center">Carregando PPBS...</div>
<script>
(async()=>{
  try{
    const fonte='https://raw.githubusercontent.com/advjuniorpedrocolombo-arch/3-TANE-IBIUNA/de748f00b63777b8023a756d7f55906a19e7059d/ppbs/index.html?ts='+Date.now();
    const r=await fetch(fonte,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let html=await r.text();
    const portal='<scr'+'ipt src="../assets/portal-dinamico.js" data-componente="PPBS"></scr'+'ipt>';
    html=html.replace('</body>',portal+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loader').innerHTML='<strong>Erro ao carregar a página de PPBS.</strong><br>'+e.message}
})();
</script>
</body></html>

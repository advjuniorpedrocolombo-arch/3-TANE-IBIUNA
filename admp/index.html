<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Administração Pública | 3º TANE</title></head>
<body>
<div id="loader" style="font-family:Arial,sans-serif;padding:32px;text-align:center">Carregando Administração Pública...</div>
<script>
(async()=>{
  try{
    const fonte='https://raw.githubusercontent.com/advjuniorpedrocolombo-arch/3-TANE-IBIUNA/c595fe8820fa0a0c0f8f04d9e5ec4733125511dc/admp/index.html?ts='+Date.now();
    const r=await fetch(fonte,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let html=await r.text();
    const portal='<scr'+'ipt src="../assets/portal-dinamico.js" data-componente="ADMP"></scr'+'ipt>';
    html=html.replace('</body>',portal+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loader').innerHTML='<strong>Erro ao carregar a página de ADMP.</strong><br>'+e.message}
})();
</script>
</body></html>
